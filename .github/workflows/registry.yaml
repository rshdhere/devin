name: registry

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: registry-${{ github.ref }}
  # Only cancel superseded pushes; workflow_dispatch must not cancel an in-flight push
  # (and vice versa) or images build but GitOps never bumps and commit checks stay red.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fewer parallel jobs reduces flaky "Failed to resolve action download info" on setup.
      max-parallel: 4
      matrix:
        include:
          - app: web
            image: devin-web
            dockerfile: docker/web/Dockerfile
          - app: server
            image: devin-server
            dockerfile: docker/server/Dockerfile
          - app: orchestrator
            image: devin-orchestrator
            dockerfile: docker/orchestrator/Dockerfile
          - app: scheduler
            image: devin-scheduler
            dockerfile: docker/scheduler/Dockerfile
          - app: brain
            image: devin-brain
            dockerfile: docker/brain/Dockerfile
          - app: firecracker
            image: devin-firecracker
            dockerfile: docker/firecracker/Dockerfile
          - app: tool-gateway
            image: devin-tool-gateway
            dockerfile: docker/tool-gateway/Dockerfile
          - app: infra
            image: devin-infra
            dockerfile: infra/Dockerfile
            context: infra
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        env:
          BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
        run: |
          set -euo pipefail
          builder=gha-builder

          bootstrap_container() {
            if ! docker image inspect "${BUILDKIT_IMAGE}" >/dev/null 2>&1; then
              docker pull "${BUILDKIT_IMAGE}"
            fi
            docker buildx rm "${builder}" >/dev/null 2>&1 || true
            docker buildx create --name "${builder}" --driver docker-container --use \
              --driver-opt "image=${BUILDKIT_IMAGE}"
            docker buildx inspect --bootstrap
          }

          bootstrap_docker_driver() {
            docker buildx rm "${builder}" >/dev/null 2>&1 || true
            docker buildx create --name "${builder}" --driver docker --use
            docker buildx inspect --bootstrap
          }

          for attempt in $(seq 1 6); do
            echo "Bootstrapping docker-container buildx (attempt ${attempt}/6)..."
            if bootstrap_container; then
              echo "Buildx ready with docker-container driver."
              exit 0
            fi
            echo "BuildKit bootstrap failed; retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done

          echo "::warning::Docker Hub BuildKit image unavailable; falling back to docker driver."
          bootstrap_docker_driver
          echo "Buildx ready with docker driver fallback."

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: matrix.app != 'web'
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long
            type=ref,event=tag

      - name: Docker metadata (web)
        if: matrix.app == 'web'
        id: meta_web
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long
            type=raw,value=${{ github.sha }}-staging,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Resolve web build args
        if: matrix.app == 'web' && github.event_name != 'pull_request'
        id: web_build_args
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            api_url="${{ vars.NEXT_PUBLIC_API_URL }}"
            web_app_url="${{ vars.NEXT_PUBLIC_WEB_APP_URL }}"
            environment="production"
          else
            api_url="${{ vars.STAGING_NEXT_PUBLIC_API_URL }}"
            web_app_url="${{ vars.STAGING_NEXT_PUBLIC_WEB_APP_URL }}"
            environment="staging"
          fi

          missing=()
          [[ -z "${api_url}" ]] && missing+=("NEXT_PUBLIC_API_URL or STAGING_NEXT_PUBLIC_API_URL")
          [[ -z "${web_app_url}" ]] && missing+=("NEXT_PUBLIC_WEB_APP_URL or STAGING_NEXT_PUBLIC_WEB_APP_URL")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub repository variables for ${environment}: ${missing[*]}"
            echo "Production: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WEB_APP_URL"
            echo "Staging: STAGING_NEXT_PUBLIC_API_URL, STAGING_NEXT_PUBLIC_WEB_APP_URL"
            exit 1
          fi

          {
            echo "api_url=${api_url}"
            echo "web_app_url=${web_app_url}"
            echo "environment=${environment}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push web
        if: matrix.app == 'web'
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web-${{ steps.web_build_args.outputs.environment || 'pr' }}
          cache-to: type=gha,mode=max,scope=web-${{ steps.web_build_args.outputs.environment || 'pr' }},ignore-error=true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.web_build_args.outputs.api_url || vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEB_APP_URL=${{ steps.web_build_args.outputs.web_app_url || vars.NEXT_PUBLIC_WEB_APP_URL }}

      - name: Build and push
        if: matrix.app != 'web'
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }},ignore-error=true

  bump-gitops:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve target overlay and image tag
        id: target
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ENVIRONMENT="production"
            OVERLAY="production/devin/overlays/external/kustomization.yaml"
            WEB_TAG="${GITHUB_SHA}"
          else
            ENVIRONMENT="staging"
            OVERLAY="staging/devin/overlays/external/kustomization.yaml"
            WEB_TAG="${GITHUB_SHA}-staging"
          fi
          {
            echo "sha=${GITHUB_SHA}"
            echo "web_tag=${WEB_TAG}"
            echo "environment=${ENVIRONMENT}"
            echo "overlay=${OVERLAY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout ops (GitOps) repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rshdhere/ops
          # Deploy key (write) — PATs in OPS_REPO_TOKEN expire/revoke and break bumps.
          ssh-key: ${{ secrets.OPS_REPO_DEPLOY_KEY }}
          path: ops

      - name: Bump image SHA
        working-directory: ops
        run: |
          set -euo pipefail
          OVERLAY="${{ steps.target.outputs.overlay }}"
          SHA="${{ steps.target.outputs.sha }}"
          WEB_TAG="${{ steps.target.outputs.web_tag }}"
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 ${SHA}|" "${OVERLAY}"
          if [[ "${{ steps.target.outputs.environment }}" == "staging" ]]; then
            # newName sits between name and newTag — range-replace so web gets the staging tag.
            sed -i -E "/name: devin-web/,/newTag:/ s|^([[:space:]]*newTag:).*|\1 ${WEB_TAG}|" "${OVERLAY}"
          fi
          echo "Updated ${OVERLAY}:"
          git --no-pager diff -- "${OVERLAY}"

      - name: Commit and push as actions-user
        working-directory: ops
        run: |
          set -euo pipefail
          OVERLAY="${{ steps.target.outputs.overlay }}"
          if git diff --quiet -- "${OVERLAY}"; then
            echo "No image changes — nothing to commit."
            exit 0
          fi
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add "${OVERLAY}"
          git commit -m "chore(devin): update orchestrator, server, brain, and web images to ${{ steps.target.outputs.sha }}"
          git push
